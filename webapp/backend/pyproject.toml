[project]
name = "job-radar-web"
version = "1.0.0"
description = "Web API for Job Search Assistant (reads the canonical MD/JSONL store)"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.27",
  # needed by the reused services.*/outputs.* modules (imported from the repo root)
  "pyyaml>=6.0",
  "python-dateutil>=2.8",
  "beautifulsoup4>=4.12",
  "lxml>=4.9",
  "markdownify>=0.11",
  "requests>=2.31",
  "curl-cffi>=0.16.3",
  # MCP server (mcp_app.py) — v2 API (mcp.server.mcpserver.MCPServer); keep in
  # step with requirements.txt
  "mcp>=2.2.0,<3",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27"]
