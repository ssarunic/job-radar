name: CI

# Runs on every PR and on pushes to main. Make this a required status check in
# branch protection so nothing merges to main unless it's green.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Python deps
        run: pip install -r requirements.txt fastapi "uvicorn[standard]" httpx pytest ruff==0.15.20
      - name: Lint Python (ruff)
        run: ruff check .
      - name: Run test suite
        run: python -m pytest tests/ webapp/backend/tests/ -q

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Lint + build frontend
        working-directory: webapp/frontend
        # npm install (not ci): the lockfile is generated on macOS and omits
        # Linux-only optional deps, so strict `npm ci` fails on the runner.
        run: |
          npm install --no-audit --no-fund
          npm run lint
          npm run build
