name: Release

# Tag-to-release: push a semver tag (e.g. v1.4.0) to build + publish the image.
# The build job depends on tests passing, so a failing build is never published
# -> the Pi can only ever pull a tested image.
on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt fastapi "uvicorn[standard]" httpx pytest
      - run: python -m pytest tests/ webapp/backend/tests/ -q

  build-push:
    needs: test                     # <-- the CI gate: no green tests, no image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write               # push to GHCR under this repo's owner
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4      # arm64 emulation on the x86 runner
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/arm64           # the Pi (and Apple-Silicon Macs) are arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # Push-based deploy: the instant the image is in GHCR, join the tailnet and tell
  # the Pi to pull + restart. Deterministic — fires on the tag, the only deploy path.
  # Requires three repo secrets — see specs/deploy.md "Push-based deploy":
  #   TS_OAUTH_CLIENT_ID / TS_OAUTH_SECRET  (Tailscale OAuth client, tag:ci)
  #   PI_SSH_KEY                            (private key; pubkey in the Pi's authorized_keys)
  deploy:
    needs: build-push                 # only deploy an image that was actually published
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7      # so we can ship the current compose file to the Pi
      - name: Join the tailnet
        uses: tailscale/github-action@v4
        with:
          oauth-client-id: ${{ secrets.TS_OAUTH_CLIENT_ID }}
          oauth-secret: ${{ secrets.TS_OAUTH_SECRET }}
          tags: tag:ci
      - name: Sync compose, pull the new image, and restart on the Pi
        env:
          PI_SSH_KEY: ${{ secrets.PI_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh && chmod 700 ~/.ssh
          printf '%s\n' "$PI_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          SSH_OPTS="-i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"
          # Ship the compose file first so compose-level changes (services, image
          # swaps) deploy too — `docker compose pull/up` only acts on what's on the Pi.
          scp $SSH_OPTS deploy/docker-compose.yml ssarunic@dalstonserver:~/job-radar/docker-compose.yml
          ssh $SSH_OPTS ssarunic@dalstonserver \
            'cd ~/job-radar && docker compose pull && docker compose --profile scheduler up -d'
