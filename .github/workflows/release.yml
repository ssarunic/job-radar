name: Release

# Tag-to-release: push a semver tag (e.g. v1.4.0) to build + publish the image.
# The build job depends on tests passing, so a failing build is never published
# -> the Pi can only ever pull a tested image.
on:
  push:
    tags: ["v*"]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt fastapi "uvicorn[standard]" httpx pytest
      - run: python -m pytest tests/ webapp/backend/tests/ -q

  build-push:
    needs: test                     # <-- the CI gate: no green tests, no image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write               # push to GHCR under this repo's owner
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3      # arm64 emulation on the x86 runner
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=sha,format=short
            type=raw,value=latest
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/arm64           # the Pi (and Apple-Silicon Macs) are arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
