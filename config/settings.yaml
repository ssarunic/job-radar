# Operational constants (SPEC §3.4 / README §10). Single-user tool — fine to hardcode.
request_timeout: 20          # seconds per URL
rate_limit_per_sec: 1        # max requests per second per domain
retries: 2                   # network retries, exponential backoff
respect_robots: true         # robots.txt check for company-site (discovery) rungs
runtime_budget_min: 30       # per-batch wall-clock budget
max_companies: 300           # hard cap
ats_max_pages: 25            # pagination cap for Workday/SmartRecruiters (logged if hit)
user_agent: "JobSeekAssistant/0.1 (+personal job search; contact ssarunic@gmail.com)"
headless: true               # Playwright headless mode
stealth: true                # playwright-stealth: defeats Cloudflare even headless

# Push notifications — fire only when a run finds new/reopened roles.
notify:
  enabled: true              # slack provider configured (webhook via $SLACK_WEBHOOK_URL)
  provider: slack            # ntfy | slack
  ntfy_topic: ""             # ntfy: a hard-to-guess topic, e.g. "ssarunic-pm-roles-7x2k9"
  slack_webhook: ""          # slack: Incoming Webhook URL; reads $SLACK_WEBHOOK_URL if blank

# Web app base URL — used for deep links in Slack notifications (role title -> /jobs/<id>).
# e.g. http://<pi-host>.<tailnet>.ts.net:8765  (leave blank to link to the external posting)
web_base_url: ""

# Claude API: read from env ANTHROPIC_API_KEY if blank. Used only for fuzzy parsing.
anthropic_api_key: ""
anthropic_model: "claude-haiku-4-5-20251001"   # cheap model for extraction; fallback to regex on failure
use_claude: false            # master switch; false = pure heuristic/regex (no API cost)
