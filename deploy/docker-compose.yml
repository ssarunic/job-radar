# Production compose for the Raspberry Pi — pulls the published image from GHCR
# (built by the Release workflow). Deploys are push-based: the `deploy` job in
# .github/workflows/release.yml SSHes in on a tag and runs `pull && up -d`.
#
#   docker login ghcr.io                         # one-time (read:packages PAT)
#   docker compose --profile scheduler up -d     # web + daily scraper
#
# Requires a .env next to this file with SLACK_WEBHOOK_URL and WEB_BASE_URL.
services:
  web:
    image: ghcr.io/ssarunic/job-radar:latest
    ports: ["8765:8765"]
    environment:
      JSA_ROOT: /data
      # /mcp Host allowlist (the MCP SDK's DNS-rebinding guard 421s unknown Hosts).
      # Tailnet name + ts.net name (with and without port, for Funnel later) —
      # see specs/mcp-server.md "Exposure".
      JSA_MCP_ALLOWED_HOSTS: ${JSA_MCP_ALLOWED_HOSTS:-dalstonserver:*,dalstonserver.tail824f04.ts.net:*,dalstonserver.tail824f04.ts.net}
    volumes:
      - jsa-data:/data
    restart: unless-stopped
    labels:
      # Opt OUT of the host's Pi-wide Watchtower — job-radar self-deploys via the
      # release.yml push-deploy job, so Watchtower must not also update it.
      com.centurylinklabs.watchtower.enable: "false"

  # Daily seek — the service that fires Slack notifications. Runs at a fixed local
  # time (default 08:00 Europe/London), not 24h after start.
  scraper:
    image: ghcr.io/ssarunic/job-radar:latest
    profiles: ["scheduler"]
    depends_on: [web]
    environment:
      JSA_ROOT: /data
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      WEB_BASE_URL: ${WEB_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SEEK_AT: ${SEEK_AT:-08:00}          # daily run time (local)
      SEEK_TZ: ${SEEK_TZ:-Europe/London}
    volumes:
      - jsa-data:/data
    restart: unless-stopped
    command: ["schedule"]
    labels:
      com.centurylinklabs.watchtower.enable: "false"   # excluded from the Pi-wide Watchtower

volumes:
  jsa-data: {}
