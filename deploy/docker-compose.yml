# Production compose for the Raspberry Pi — pulls the published image from GHCR
# (built by the Release workflow). Watchtower auto-updates the containers when a
# new image is published, so a `git tag vX.Y.Z` deploys itself.
#
#   docker login ghcr.io                         # one-time (read:packages PAT)
#   docker compose --profile scheduler up -d     # web + daily scraper + watchtower
#
# Requires a .env next to this file with SLACK_WEBHOOK_URL and WEB_BASE_URL.
services:
  web:
    image: ghcr.io/ssarunic/job-search-assistant:latest
    ports: ["8765:8765"]
    environment:
      JSA_ROOT: /data
    volumes:
      - jsa-data:/data
    restart: unless-stopped
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # Daily seek — the service that fires Slack notifications. Runs at a fixed local
  # time (default 08:00 Europe/London), not 24h after start.
  scraper:
    image: ghcr.io/ssarunic/job-search-assistant:latest
    profiles: ["scheduler"]
    depends_on: [web]
    environment:
      JSA_ROOT: /data
      SLACK_WEBHOOK_URL: ${SLACK_WEBHOOK_URL:-}
      WEB_BASE_URL: ${WEB_BASE_URL:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      SEEK_AT: ${SEEK_AT:-08:00}          # daily run time (local)
      SEEK_TZ: ${SEEK_TZ:-Europe/London}
    volumes:
      - jsa-data:/data
    restart: unless-stopped
    command: ["schedule"]
    labels:
      com.centurylinklabs.watchtower.enable: "true"

  # Fallback poller: watches GHCR and recreates the labelled containers when a new
  # image lands. The push-based deploy job in .github/workflows/release.yml is the
  # primary path (deploys the instant a tag's image is built); this is the safety net.
  #
  # NOTE: uses the maintained fork `nickfedor/watchtower`, not the abandoned
  # `containrrr/watchtower` — the latter's bundled Docker API client (v1.25) is too
  # old for modern Docker Engine (min API 1.40), so it crash-loops against the daemon.
  watchtower:
    image: ghcr.io/nicholas-fedor/watchtower
    restart: unless-stopped
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ${HOME}/.docker/config.json:/config.json:ro   # GHCR creds from `docker login`
    command: --label-enable --cleanup --interval 300   # only labelled containers; poll 5 min

volumes:
  jsa-data: {}
